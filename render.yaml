# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploys the ToiletTime server (API + web app). Render asks for the values marked
# sync: false when you create the Blueprint: your Supabase project's URL and keys, and its
# database connection string (DATABASE_URL), where ratings are stored.
services:
  - type: web
    name: toilettime
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
