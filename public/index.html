<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToiletTime — Restroom ratings worldwide</title>
  <meta name="description" content="Find and rate restrooms at stores, restaurants and cafés around the world.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.85 5.78 6.38.93-4.62 4.5 1.09 6.35L12 17.36l-5.7 3 1.09-6.35-4.62-4.5 6.38-.93z"/></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="/">
      <img src="favicon.svg" alt="" width="28" height="28">
      <span>ToiletTime</span>
    </a>
    <div class="place-search">
      <svg class="icon"><use href="#i-search"/></svg>
      <input id="placeSearch" type="search" placeholder="Go to a city or address" aria-label="Go to a city or address">
    </div>
    <button id="accountBtn" class="btn account-btn" aria-label="Sign in">
      <svg class="icon"><use href="#i-user"/></svg><span id="accountLabel">Sign in</span>
    </button>
    <button id="addBtn" class="btn btn-primary">
      <svg class="icon"><use href="#i-plus"/></svg><span>Add restroom</span>
    </button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <!-- List view -->
      <section id="listView" class="view">
        <div class="filters">
          <div class="field-icon">
            <svg class="icon"><use href="#i-search"/></svg>
            <input id="search" type="search" placeholder="Filter by name, city or country" aria-label="Filter restrooms">
          </div>
          <div class="filter-row">
            <select id="typeFilter" aria-label="Place type"><option value="">All place types</option></select>
            <select id="sort" aria-label="Sort by">
              <option value="rating">Highest rated</option>
              <option value="worst">Lowest rated</option>
              <option value="reviews">Most reviewed</option>
              <option value="newest">Recently added</option>
            </select>
          </div>
        </div>
        <div class="list-head">
          <span id="resultCount" class="muted"></span>
          <button id="locateBtn" class="btn-link">
            <svg class="icon"><use href="#i-locate"/></svg>Near me
          </button>
        </div>
        <ul id="list" class="list"></ul>
      </section>

      <!-- Detail view -->
      <section id="detailView" class="view" hidden>
        <div class="detail-nav">
          <button id="backBtn" class="btn-link"><svg class="icon"><use href="#i-back"/></svg>All restrooms</button>
        </div>
        <div id="detailBody" class="detail"></div>
      </section>
    </aside>
    <section id="map" class="map" aria-label="Map"></section>
  </main>

  <!-- Add restroom -->
  <dialog id="addDialog" class="modal">
    <form id="addForm" class="modal-inner" novalidate>
      <header class="modal-head">
        <h2>Add a restroom</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
      </header>

      <div class="modal-body">
        <fieldset>
          <legend>Location</legend>
          <div class="field-icon">
            <svg class="icon"><use href="#i-search"/></svg>
            <input id="lookup" placeholder="Search for a business or address" autocomplete="off">
          </div>
          <ul id="lookupResults" class="lookup-results"></ul>
          <p class="help">Or click the map to set the location manually.</p>
          <label class="field">Business name
            <input name="name" required maxlength="100">
          </label>
          <div class="grid-2">
            <label class="field">Type<select name="type" id="addType"></select></label>
            <label class="field">Street address<input name="address" maxlength="200"></label>
            <label class="field">City<input name="city" maxlength="80"></label>
            <label class="field">Country<input name="country" maxlength="80"></label>
            <label class="field">Latitude<input name="lat" type="number" step="any" required min="-90" max="90"></label>
            <label class="field">Longitude<input name="lng" type="number" step="any" required min="-180" max="180"></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Amenities</legend>
          <div class="checks">
            <label class="check"><input type="checkbox" name="free" checked><span>Free to use</span></label>
            <label class="check"><input type="checkbox" name="accessible"><span>Wheelchair accessible</span></label>
            <label class="check"><input type="checkbox" name="babyChanging"><span>Baby changing station</span></label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Your review</legend>
          <div id="addRating"></div>
        </fieldset>
      </div>

      <footer class="modal-foot">
        <p id="addError" class="error" role="alert"></p>
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Publish</button>
      </footer>
    </form>
  </dialog>

  <!-- Sign in / create account -->
  <dialog id="authDialog" class="modal modal-sm">
    <form id="authForm" class="modal-inner" novalidate>
      <header class="modal-head">
        <h2 id="authTitle">Sign in</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
      </header>
      <div class="modal-body auth-body">
        <p id="authReason" class="help"></p>
        <label class="field" id="nameField" hidden>Name
          <input name="name" maxlength="40" autocomplete="name" placeholder="Shown on your reviews">
        </label>
        <label class="field">Email
          <input name="email" type="email" autocomplete="email" required>
        </label>
        <label class="field">Password
          <input name="password" type="password" autocomplete="current-password" required minlength="8">
        </label>
        <p id="authError" class="error" role="alert"></p>
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Sign in</button>
        <p class="auth-switch"><span id="authSwitchText">New to ToiletTime?</span>
          <button type="button" class="btn-link" id="authSwitch">Create an account</button></p>
      </div>
    </form>
  </dialog>

  <!-- Account -->
  <dialog id="accountDialog" class="modal modal-sm">
    <div class="modal-inner">
      <header class="modal-head">
        <h2>Account</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close"><svg class="icon"><use href="#i-close"/></svg></button>
      </header>
      <div class="modal-body account-body">
        <span class="avatar avatar-lg" id="accountAvatar"></span>
        <div class="account-name" id="accountName"></div>
        <div class="muted" id="accountEmail"></div>
        <div class="muted small" id="accountSince"></div>
        <button type="button" class="btn btn-block" id="signOutBtn">Sign out</button>
        <button type="button" class="btn-link danger" id="deleteAccountBtn">Delete account</button>
      </div>
    </div>
  </dialog>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
